name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # =========================
  # 1. Lint & Tests unitaires
  # =========================
  test:
    name: Lint & Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run linter
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # =========================
  # 2. Sécurité (audit deps + scan image)
  # =========================
  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high || true

      - name: Build Docker image for scanning
        run: docker build -t helpdesk:scan .

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.70.0

      - name: Run Trivy scan
        run: |
          trivy image helpdesk:scan \
            --severity HIGH,CRITICAL \
            --format table \
            --exit-code 0

  # =========================
  # 3. Build Docker
  # =========================
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: helpdesk:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.70.0

      - name: Scan Docker image with Trivy
        run: |
          trivy image helpdesk:scan \
            --severity HIGH,CRITICAL \
            --format table \
            --exit-code 0

  # =========================
  # 4. Deploy VPS via SSH (main uniquement)
  # =========================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test, security, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_APP_PATH }}

            echo "→ Pull du code..."
            git pull origin main

            echo "→ Build et redémarrage des conteneurs..."
            docker compose down
            docker compose up -d --build

            echo "→ Migrations DB..."
            docker compose exec -T app npx prisma migrate deploy

            echo "→ Vérification santé..."
            sleep 10
            curl -f http://localhost:3000/api/health && echo "✓ App OK" || echo "✗ App KO"
